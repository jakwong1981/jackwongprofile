# backend/src/main/resources/application-docker.yml
# Docker-specific configuration for SIT environment

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jackwong_profile?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:profile}
    password: ${DB_PASSWORD:profile}
    hikari:
      pool-name: profile-hikari-docker
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:3}
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql

logging:
  level:
    root: INFO
    com.jackwong.profile: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  security:
    jwt:
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLWRldi1vbmx5LTI1Ni1iaXQtc2VjcmV0LWtleQ==}
      issuer: jackwong-profile-sit
      access-token-ttl-seconds: ${JWT_ACCESS_TTL:3600}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:ChangeMe123!}
      display-name: SIT Administrator

  deepseek:
    enabled: ${DEEPSEEK_ENABLED:false}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: 0.2
    max-tokens: 1200
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

  news:
    ingestion:
      enabled: ${NEWS_INGESTION_ENABLED:true}
      # Run every 6 hours in SIT
      cron: ${NEWS_INGESTION_CRON:0 0 */6 * * *}
      max-items-per-source: 8
      user-agent: "JackWongProfileBot/1.0-SIT (+https://github.com/quo8/jackwongprofile)"
      request-timeout-ms: 15000
      auto-analyze: ${NEWS_AUTO_ANALYZE:false}